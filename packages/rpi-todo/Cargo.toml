[package]
name = "rpi-todo"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Session task lists with progress states for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "todo", "agent", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { version = "0.4.0", path = "../../../pi-rust/crates/rpi-plugin-sdk" }
kiqi-plugin = { path = "../../../pi-rust/crates/kiqi-plugin" }
serde_json = { workspace = true }
