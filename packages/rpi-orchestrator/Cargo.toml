[package]
name = "rpi-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded DAG subagent orchestration extension for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "subagent", "orchestration", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
serde_json = { workspace = true }
wait-timeout = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Kill the child's whole process group so a subagent's descendants (e.g. a
# background `sleep`) do not survive as orphans when we cancel.
nix = { version = "0.29", features = ["process", "signal"] }
